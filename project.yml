# Generate the Xcode project with:  xcodegen generate
# The .xcodeproj is intentionally not committed; this file is the source of truth.
name: OpenReadiness

options:
  bundleIdPrefix: org.openreadiness
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your own team to run on device (Xcode › Signing & Capabilities).
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

packages:
  ReadinessKit:
    path: Packages/ReadinessKit

targets:
  OpenReadiness:
    type: application
    platform: iOS
    sources:
      - App/iOS
      - App/Shared
    dependencies:
      - package: ReadinessKit
        product: ReadinessCore
      - package: ReadinessKit
        product: ReadinessHealthKit
      - package: ReadinessKit
        product: HealthInsights
      - target: OpenReadinessWatch
    entitlements:
      path: App/iOS/OpenReadiness.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: App/iOS/Info.plist
      properties:
        CFBundleDisplayName: OpenReadiness
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        NSHealthShareUsageDescription: >-
          OpenReadiness reads your Apple Watch data (heart, sleep, activity, workouts, vitals, mobility
          and environment) to calculate your readiness score and draw charts on this iPhone. Nothing
          leaves your device.
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiredDeviceCapabilities:
          - healthkit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.openreadiness.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets:
        - OpenReadinessUITests
      commandLineArguments:
        "-demo": false

  OpenReadinessWatch:
    type: application
    platform: watchOS
    sources:
      - App/watchOS
      - App/Shared
    dependencies:
      - package: ReadinessKit
        product: ReadinessCore
      - package: ReadinessKit
        product: ReadinessHealthKit
    entitlements:
      path: App/watchOS/OpenReadinessWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: App/watchOS/Info.plist
      properties:
        CFBundleDisplayName: OpenReadiness
        WKApplication: true
        WKCompanionAppBundleIdentifier: org.openreadiness.app
        NSHealthShareUsageDescription: >-
          OpenReadiness reads heart rate variability, heart rate, sleep and workouts to estimate your
          readiness on your watch. Nothing leaves your devices.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.openreadiness.app.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  OpenReadinessUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: OpenReadiness
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.openreadiness.app.uitests
        GENERATE_INFOPLIST_FILE: YES
