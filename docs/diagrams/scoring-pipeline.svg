<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 880 820" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="scoring-pipeline-title scoring-pipeline-desc">
      <title id="scoring-pipeline-title">Readiness scoring pipeline</title>
      <desc id="scoring-pipeline-desc">HealthKit samples become daily metrics, are compared with a 60-day personal baseline, turned into five sub-scores and combined by weight; if any physiological sub-score is below 30 the total is capped, and the result is rounded to a 0–10 score with an Apple-compatible band.</desc>
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Arrows (behind shapes) -->
      <line x1="320" y1="72" x2="320" y2="104" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="320" y1="168" x2="320" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="320" y1="264" x2="320" y2="296" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="320" y1="360" x2="320" y2="392" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="320" y1="456" x2="320" y2="488" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Decision: YES → cap (right) -->
      <line x1="420" y1="536" x2="500" y2="536" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- Decision: NO → merge (down) -->
      <line x1="320" y1="584" x2="320" y2="642" stroke="#4f5d75" stroke-width="1.2"/>
      <!-- Cap → merge -->
      <path d="M 600,568 V 640 Q 600,648 592,648 H 326"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Merge → result -->
      <line x1="320" y1="652" x2="320" y2="680" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrow labels -->
      <rect x="444" y="516" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="460" y="525" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
      <rect x="328" y="604" width="24" height="12" rx="2" fill="#f5f5f5"/>
      <text x="340" y="613" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>

      <!-- Start: HealthKit samples -->
      <rect x="240" y="32" width="160" height="40" rx="20" fill="#f5f5f5"/>
      <rect x="240" y="32" width="160" height="40" rx="20" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399" stroke-width="1"/>
      <text x="320" y="56" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">HealthKit samples</text>

      <!-- 01 Daily metrics -->
      <rect x="220" y="104" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="220" y="104" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="320" y="132" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Daily metrics</text>
      <text x="320" y="148" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">per wake day · like-for-like</text>

      <!-- 02 Personal baselines -->
      <rect x="220" y="200" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="220" y="200" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="320" y="228" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Personal baselines</text>
      <text x="320" y="244" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">prior 60 days · median ± MAD</text>

      <!-- 03 Sub-scores -->
      <rect x="220" y="296" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="220" y="296" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="320" y="324" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Five sub-scores, 0–100</text>
      <text x="320" y="340" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">your normal scores 70</text>

      <!-- 04 Weighted mean -->
      <rect x="220" y="392" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="220" y="392" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="320" y="420" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Weighted mean</text>
      <text x="320" y="436" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">missing weight shared out</text>

      <!-- Decision (focal) -->
      <polygon points="320,488 420,536 320,584 220,536" fill="#f5f5f5"/>
      <polygon points="320,488 420,536 320,584 220,536" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
      <text x="320" y="532" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Any body signal</text>
      <text x="320" y="546" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">below 30?</text>

      <!-- Cap -->
      <rect x="500" y="504" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="500" y="504" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="600" y="532" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cap the total</text>
      <text x="600" y="548" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">weakest + 35 ÷ flags</text>

      <!-- Merge dot -->
      <circle cx="320" cy="648" r="4" fill="#2d3142"/>

      <!-- End: score -->
      <rect x="220" y="680" width="200" height="48" rx="20" fill="#f5f5f5"/>
      <rect x="220" y="680" width="200" height="48" rx="20" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399" stroke-width="1"/>
      <text x="320" y="700" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Score 0–10 + band</text>
      <text x="320" y="716" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Recover · Pace · Ready · Go</text>

      <!-- Legend strip -->
      <line x1="40" y1="760" x2="840" y2="760" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
      <text x="40" y="776" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="792" width="20" height="10" rx="5" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399" stroke-width="1"/>
      <text x="68" y="800" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Input / output</text>

      <rect x="172" y="792" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="192" y="800" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Step</text>

      <polygon points="260,791 272,797 260,803 248,797" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
      <text x="280" y="800" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Limiting-factor check</text>

      <circle cx="412" cy="797" r="4" fill="#2d3142"/>
      <text x="424" y="800" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Merge</text>

      <line x1="484" y1="797" x2="512" y2="797" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="520" y="800" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Red-flag path (illness, a very bad night)</text>
    </svg>
