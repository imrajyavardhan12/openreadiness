<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 576" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc">
      <title id="architecture-title">OpenReadiness architecture</title>
      <desc id="architecture-desc">HealthKit data is read by the package's adapters and analysed by the pure-Swift ReadinessCore and HealthInsights modules; the iPhone app publishes a snapshot to an App Group that widgets read and sends it to the watch, while background delivery refreshes the snapshot when the app is closed.</desc>
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Zone: the Swift package (drawn before arrows and nodes) -->
      <rect x="216" y="144" width="384" height="240" rx="8"
            fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
      <rect x="352" y="148" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="408" y="157" fill="#2d3142" fill-opacity="0.40" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.14em">READINESSKIT PACKAGE</text>

      <!-- Arrows (behind boxes) -->
      <!-- HealthKit → adapters -->
      <line x1="184" y1="272" x2="232" y2="272" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- adapters → ReadinessCore / HealthInsights (fanned attach points 256 / 288) -->
      <path d="M 376,256 H 392 Q 400,256 400,248 V 216 Q 400,208 408,208 H 424"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 376,288 H 392 Q 400,288 400,296 V 328 Q 400,336 408,336 H 424"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- ReadinessCore → iPhone app (primary flow) -->
      <line x1="584" y1="208" x2="624" y2="208" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- HealthInsights → iPhone app (enters bottom) -->
      <path d="M 584,336 H 688 Q 696,336 696,328 V 240"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- iPhone app → Snapshot -->
      <line x1="768" y1="208" x2="816" y2="208" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- iPhone app → Watch app (WatchConnectivity) -->
      <path d="M 696,176 V 104 Q 696,96 704,96 H 816"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Snapshot → Widgets -->
      <line x1="888" y1="240" x2="888" y2="304" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- HealthKit → Background refresh (observer wake-up, async) -->
      <path d="M 112,304 V 440 Q 112,448 120,448 H 624"
            fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <!-- Background refresh → Snapshot (separate attach point at y=232) -->
      <path d="M 768,448 H 784 Q 792,448 792,440 V 240 Q 792,232 800,232 H 816"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrow labels (paper masks, ≥8px above their strokes) -->
      <rect x="192" y="252" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="208" y="261" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">READ</text>

      <rect x="588" y="188" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="604" y="197" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SCORE</text>

      <rect x="600" y="316" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="632" y="325" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ANALYTICS</text>

      <rect x="772" y="188" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="792" y="197" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WRITE</text>

      <rect x="728" y="76" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="760" y="85" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WCSESSION</text>

      <rect x="896" y="266" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="912" y="275" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">READ</text>

      <rect x="328" y="428" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="356" y="437" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NEW DATA</text>

      <!-- Node: HealthKit (store) -->
      <rect x="40" y="240" width="144" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="240" width="144" height="64" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
      <rect x="48" y="248" width="28" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.50" stroke-width="0.8"/>
      <text x="62" y="257" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OS</text>
      <text x="112" y="276" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">HealthKit</text>
      <text x="112" y="292" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Apple Watch data</text>

      <!-- Node: HealthKit adapters -->
      <rect x="232" y="240" width="144" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="232" y="240" width="144" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="240" y="248" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="254" y="257" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PKG</text>
      <text x="304" y="276" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">HealthKit adapters</text>
      <text x="304" y="292" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">read-only · async</text>

      <!-- Node: ReadinessCore (focal) -->
      <rect x="424" y="176" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="424" y="176" width="160" height="64" rx="6" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
      <rect x="432" y="184" width="28" height="12" rx="2" fill="none" stroke="#eb6c36" stroke-opacity="0.50" stroke-width="0.8"/>
      <text x="446" y="193" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PKG</text>
      <text x="504" y="212" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ReadinessCore</text>
      <text x="504" y="228" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">pure Swift · 0–10 score</text>

      <!-- Node: HealthInsights -->
      <rect x="424" y="304" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="424" y="304" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="432" y="312" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="446" y="321" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PKG</text>
      <text x="504" y="340" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">HealthInsights</text>
      <text x="504" y="356" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">analytics · insights</text>

      <!-- Node: iPhone app -->
      <rect x="624" y="176" width="144" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="624" y="176" width="144" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="632" y="184" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="646" y="193" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
      <text x="696" y="212" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">iPhone app</text>
      <text x="696" y="228" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SwiftUI · Swift Charts</text>

      <!-- Node: Background refresh (async) -->
      <rect x="624" y="416" width="144" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="624" y="416" width="144" height="64" rx="6" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="632" y="424" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.22" stroke-width="0.8"/>
      <text x="646" y="433" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BG</text>
      <text x="696" y="452" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Background refresh</text>
      <text x="696" y="468" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">app closed · headless</text>

      <!-- Node: Snapshot (App Group store) -->
      <rect x="816" y="176" width="144" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="816" y="176" width="144" height="64" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
      <rect x="824" y="184" width="28" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.50" stroke-width="0.8"/>
      <text x="838" y="193" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GRP</text>
      <text x="888" y="212" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Snapshot</text>
      <text x="888" y="228" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">App Group</text>

      <!-- Node: Widgets -->
      <rect x="816" y="304" width="144" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="816" y="304" width="144" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="824" y="312" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="838" y="321" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
      <text x="888" y="340" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Widgets</text>
      <text x="888" y="356" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">home · lock screen</text>

      <!-- Node: Watch app -->
      <rect x="816" y="64" width="144" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="816" y="64" width="144" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="824" y="72" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="838" y="81" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
      <text x="888" y="100" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Watch app</text>
      <text x="888" y="116" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">+ complications</text>

      <!-- Legend strip -->
      <line x1="40" y1="504" x2="960" y2="504" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
      <text x="40" y="520" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="536" width="14" height="10" rx="2" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
      <text x="60" y="544" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Scoring engine</text>

      <rect x="164" y="536" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="184" y="544" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Module / app</text>

      <rect x="284" y="536" width="14" height="10" rx="2" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
      <text x="304" y="544" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Data store</text>

      <rect x="392" y="536" width="14" height="10" rx="2" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="412" y="544" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Runs in background</text>

      <line x1="540" y1="542" x2="568" y2="542" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="576" y="544" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Primary flow</text>

      <line x1="676" y1="542" x2="704" y2="542" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="712" y="544" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Data flow</text>

      <line x1="796" y1="542" x2="824" y2="542" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="832" y="544" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">System wake-up</text>
    </svg>
